name: Validate storefront
on:
  push:
    branches:
      - expanded-commerce-experience
  pull_request:
    branches:
      - main
      - multi-page-boutique-storefront
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
